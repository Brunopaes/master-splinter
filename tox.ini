[tox]
requires =
    tox>=4.11
env_list =
    test-py{313,314}
    format-check
    build
    type  # uncomment this when using type hints to enable type checking

# No base_python here on purpose: the envs without a pyXY factor - format-check,
# build, type - run on whichever interpreter invoked tox. Pinning one would make
# CI need that exact version installed just to lint.

# requires-python is >=3.11, so the floor and the ceiling both want exercising.
# Only 3.13 and 3.14 are installed here; add test-py311 and test-py312 wherever
# those interpreters exist, because the 3.11 and 3.12 classifiers are a claim
# nothing currently checks. ruff and mypy stay pinned at the 3.11 floor rather
# than following the newest env - linting against the newest interpreter is how
# 3.12+ syntax reaches a package that promises 3.11.
[testenv:test-py{311,312,313,314}]
description = Run unit tests and output coverage report
base_python =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
extras =
    test
deps =
    # tests/cli/ exercises cli/, the repository-only front end, which renders.
    # Not an extra on the project: the distributable draws nothing, and a
    # published master-splinter[plots] would install matplotlib and give the
    # installer no way to use it.
    matplotlib>=3.8,<4
commands =
    coverage run -m pytest
    coverage report

[testenv:format-check]
description = Check code is compliant with ruff
skip_install = true
deps =
    {[testenv:format]deps}
commands =
    ruff check {posargs}
    ruff format --diff {posargs}
    pyproject-fmt pyproject.toml --check

[testenv:type]
description = Run type checking using mypy
deps =
    mypy==1.11.0
commands =
    mypy src --install-types --non-interactive {posargs}

[testenv:build]
description = Build the sdist and wheel and check their metadata
skip_install = true
deps =
    build>=1.2
    twine>=5
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build
    twine check --strict dist/{env:DIST_GLOB:*}

[testenv:format]
description = Automatically format and lint code using ruff
skip_install = true
deps =
    pyproject-fmt==2.8
    ruff==0.14.2
commands =
    ruff check --fix {posargs}
    ruff format {posargs}
    - pyproject-fmt pyproject.toml

