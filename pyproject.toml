[build-system]
build-backend = 'setuptools.build_meta'

requires = [
  "setuptools>=44",
]

[project]
name = "master-splinter"
requires-python = "==3.13.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]

dynamic = [
  "version",
]
dependencies = [
  "matplotlib>=3.8,<4",
]
optional-dependencies.dev = [
  "black>=24.10,<25",
  "ipython>=8.31,<9",
  "isort>=6b2,<7",
  "ruff==0.14.2",
  "tox-uv>=1.9.1,<2",
]
optional-dependencies.test = [
  "freezegun>=1.5.1,<2",
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[tool.ruff]
target-version = "py313"
line-length = 79
src = [
  "src",
  "tests",
]
exclude = [
  "__pycache__",
]

[tool.pytest.ini_options]
markers = [
  "exclude_from_docker: don't run these tests inside docker",
  "only_in_docker: only run these tests inside docker",
]
addopts = "-m 'not only_in_docker' --strict-markers"
pythonpath = [ "src" ]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [ "pragma: no cover" ]

[tool.coverage.run]
omit = [ "**/__init__.py" ]
source = [ "src/" ]

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
